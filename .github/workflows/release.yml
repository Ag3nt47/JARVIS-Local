name: Build Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -e ".[dev,desktop]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest -q
      - name: Build desktop application
        shell: powershell
        run: .\scripts\build_desktop.ps1
      - name: Package and checksum release
        shell: powershell
        env:
          JARVIS_RELEASE_REF: ${{ github.ref_name }}
        run: |
          $archive = "JARVIS-$env:JARVIS_RELEASE_REF-win64.zip"
          Compress-Archive -Path dist\JARVIS\* -DestinationPath $archive
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$digest  $archive" | Set-Content -Encoding ascii "$archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JARVIS-${{ github.ref_name }}-win64
          path: |
            JARVIS-${{ github.ref_name }}-win64.zip
            JARVIS-${{ github.ref_name }}-win64.zip.sha256
          if-no-files-found: error
